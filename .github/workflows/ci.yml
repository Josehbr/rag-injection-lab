name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Análise estática de segurança (bandit)
        run: bandit -c pyproject.toml -r src
      - name: Auditoria de dependências (pip-audit)
        run: pip-audit
      - name: Testes
        run: python -m pytest -q
      - name: Experimento mock end-to-end
        run: |
          python -m rag_injection_lab run --mock
          python -m rag_injection_lab report
