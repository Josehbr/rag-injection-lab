[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-injection-lab"
version = "0.1.0"
description = "Laboratório mensurável de injeção de prompt indireta em RAG: ataques, defesas em camadas e taxa de sucesso com intervalo de confiança."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "José Hernane" }]
requires-python = ">=3.11"
dependencies = ["litellm>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "bandit[toml]", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
